name: FCC Stage-0 CI Foundation
on: [push, pull_request]
jobs:
  foundation-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: git config user.email ci@fcc-record.local && git config user.name "FCC CI"
      - run: npm test   # runs BUILD 01 + BUILD 02 batteries together; BUILD 01 tests must stay green

  filing-log-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: git config user.email ci@fcc-record.local && git config user.name "FCC CI"
      - run: node tools/run-filing-log-tests.js

  build02-fixtures-isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: git config user.email ci@fcc-record.local && git config user.name "FCC CI"
      - run: node tools/run-build02-tests.js
      - run: node tools/verify-candidate-quarantine.js

  append-only-actual-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Determine comparison range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CI_APPEND_ONLY_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CI_APPEND_ONLY_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CI_APPEND_ONLY_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "CI_APPEND_ONLY_HEAD=${{ github.event.after }}" >> "$GITHUB_ENV"
          fi
      - run: node tools/ci-append-only-check.js
      - run: node tools/run-append-correction-tests.js

  cross-os-byte-and-hash-equality:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: node tools/verify-frozen-hashes.js
      - run: node tools/verify-byte-preservation.js
      - run: node tools/verify-byte-manifest-completeness.js
      - run: node tools/verify-schemas.js
      - run: node tools/run-build02-tests.js   # dual canonicalization must agree on every OS too

  canonicalization-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: node -e "const c=require('canonicalize'); console.log(c({b:1,a:2}))" > /tmp/js.out
      - run: python3 -c "import rfc8785; print(rfc8785.dumps({'b':1,'a':2}).decode())" > /tmp/py.out
      - run: diff /tmp/js.out /tmp/py.out && echo "JS/Python RFC 8785 parity confirmed"

  build03-witness-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: git config user.email ci@fcc-record.local && git config user.name "FCC CI"
      - run: node tools/run-build03-tests.js

  build04-experiment-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: git config user.email ci@fcc-record.local && git config user.name "FCC CI"
      - run: node tools/verify-experiment-freeze.js
      - run: node tools/run-build04-tests.js

  build04-1-candidate-intake-machinery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: git config user.email ci@fcc-record.local && git config user.name "FCC CI"
      - run: node tools/verify-experiment-freeze.js
      - run: node tools/run-build04-1-tests.js
      - run: node tools/ci-intake-guard.js

  build03-1-closure-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: git config user.email ci@fcc-record.local && git config user.name "FCC CI"
      - run: node tools/verify-frozen-hashes.js
      - run: node tools/run-build03-1-closure-tests.js
      - run: node tools/compute-intake-cutoff.js

  acquisition-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: git config user.email ci@fcc-record.local && git config user.name "FCC CI"
      - run: node tools/run-addendum-tests.js
      - run: node tools/run-b2-adjudication-tests.js
      - run: node tools/run-intake-authorization-tests.js
      - run: node tools/run-live-intake-wiring-tests.js
      - run: node tools/run-scope-discovery-tests.js
      - run: node tools/run-discovery-query-tests.js
      - run: node tools/run-a2-ratelimit-tests.js
      - run: node tools/run-a2-chainid-tests.js
      - run: node tools/run-a2-timestamp-fix-tests.js
      - run: node tools/verify-acquisition-readiness.js
